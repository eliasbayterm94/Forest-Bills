[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."process-bill"]
  timeout = 26

# scan-gmail must stay HTTP-invocable (frontend button); a schedule here would
# make Netlify reject direct requests with 403. The daily cron runs via
# scheduled-scan below, which calls the same logic internally.
[functions."scan-gmail"]
  timeout = 26

[functions."scheduled-scan"]
  schedule = "0 8 * * *"
  timeout = 26

[functions."fetch-bills"]
  timeout = 26

[functions."vendor-config"]
  timeout = 26

# Daily email digest at 8:30am UTC (after scan completes)
[functions."email-digest"]
  schedule = "30 8 * * *"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
